plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // add extra maven repos here if you need any
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No "mappings" line here on purpose: from 26.1 onward Minecraft ships
    // unobfuscated, so Loom defaults to Mojang's official mappings and there's
    // nothing to remap. This is also why fabric-loader/fabric-api below use
    // plain "implementation" instead of the old "modImplementation".
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
